name: Desplegar SICREP en VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -e
            APP_DIR=/opt/sicrep

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone https://github.com/Houmeecl/sicrep2026 "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            if ! command -v psql >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y postgresql postgresql-contrib
              systemctl enable postgresql
              systemctl start postgresql
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            # Delimitador entre comillas: GitHub ya sustituyó los secrets y el shell no debe
            # expandir $, comillas invertidas ni $(...) que vengan dentro de una contraseña.
            cat > .env <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            NODE_ENV=production
            PORT=5000
            FLOW_API_KEY=${{ secrets.FLOW_API_KEY }}
            FLOW_SECRET_KEY=${{ secrets.FLOW_SECRET_KEY }}
            FLOW_ENV=${{ secrets.FLOW_ENV }}
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}
            TRUST_PROXY=${{ secrets.TRUST_PROXY }}
            UPLOAD_DIR=/var/lib/sicrep/kyc
            CARD_SIGNING_SECRET=${{ secrets.CARD_SIGNING_SECRET }}
            PREINSCRIPCION_VIGENCIA_MESES=${{ secrets.PREINSCRIPCION_VIGENCIA_MESES }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            APPLE_PASS_TYPE_ID=${{ secrets.APPLE_PASS_TYPE_ID }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_WWDR_PEM=${{ secrets.APPLE_WWDR_PEM_PATH }}
            APPLE_SIGNER_CERT_PEM=${{ secrets.APPLE_SIGNER_CERT_PEM_PATH }}
            APPLE_SIGNER_KEY_PEM=${{ secrets.APPLE_SIGNER_KEY_PEM_PATH }}
            APPLE_SIGNER_KEY_PASSPHRASE=${{ secrets.APPLE_SIGNER_KEY_PASSPHRASE }}
            GOOGLE_WALLET_ISSUER_ID=${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
            GOOGLE_WALLET_SA_EMAIL=${{ secrets.GOOGLE_WALLET_SA_EMAIL }}
            GOOGLE_WALLET_SA_PRIVATE_KEY=${{ secrets.GOOGLE_WALLET_SA_PRIVATE_KEY_PATH }}
            EOF

            # Documentos KYC fuera del repositorio (no los toca el git reset) y solo legibles por el servicio.
            mkdir -p /var/lib/sicrep/kyc && chmod 700 /var/lib/sicrep/kyc

            npm ci
            yes | npm run db:push || npm run db:push
            npm run build

            pm2 delete sicrep 2>/dev/null || true
            pm2 start dist/index.js --name sicrep
            pm2 save
            pm2 startup systemd -u root --hp /root >/dev/null 2>&1 || true
