name: Desplegar SICREP en VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -e
            APP_DIR=/opt/sicrep

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone https://github.com/Houmeecl/sicrep2026 "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            if ! command -v psql >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y postgresql postgresql-contrib
              systemctl enable postgresql
              systemctl start postgresql
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            cat > .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            PORT=5000
            FLOW_API_KEY=${{ secrets.FLOW_API_KEY }}
            FLOW_SECRET_KEY=${{ secrets.FLOW_SECRET_KEY }}
            FLOW_ENV=${{ secrets.FLOW_ENV }}
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}
            EOF

            npm ci
            yes | npm run db:push || npm run db:push
            npm run build

            pm2 delete sicrep 2>/dev/null || true
            pm2 start dist/index.js --name sicrep
            pm2 save
            pm2 startup systemd -u root --hp /root >/dev/null 2>&1 || true
