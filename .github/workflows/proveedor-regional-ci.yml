name: Proveedor Regional · pruebas

on:
  push:
    paths: ['proveedor-regional/**', '.github/workflows/proveedor-regional-ci.yml']
  pull_request:
    paths: ['proveedor-regional/**', '.github/workflows/proveedor-regional-ci.yml']

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: proveedor-regional/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proveedor-regional/server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pr_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proveedor-regional/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proveedor-regional/web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t proveedor-regional:ci proveedor-regional
      - name: Probar que la imagen arranca
        run: |
          docker network create prnet
          docker run -d --name db --network prnet -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=pr postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name app --network prnet -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres:postgres@db:5432/pr \
            -e JWT_SECRET=$(openssl rand -hex 32) -e PUBLIC_URL=https://ci.ejemplo.cl \
            -e ADMIN_EMAIL=ci@ejemplo.cl -e ADMIN_PASSWORD=clave-de-ci-segura proveedor-regional:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/api/salud && break; sleep 1; done
          curl -fs localhost:3000/api/salud
          curl -fs localhost:3000/ | grep -q 'Proveedor Regional'
          docker logs app
